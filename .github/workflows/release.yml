name: Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Lint, test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/dist
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build dev archive
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cargo xtask dist --version "dev-${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: svid2usb-dev
          path: target/dist/svid2usb-dev-*-macos-universal.zip
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/dist
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build release archive
        run: |
          cargo xtask dist --version "${GITHUB_REF_NAME#v}"
          echo "ARCHIVE=target/dist/svid2usb-${GITHUB_REF_NAME#v}-macos-universal.zip" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          files=()
          [ ! -f "$ARCHIVE" ] || files=("$ARCHIVE")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease="$PRERELEASE"
            [ ${#files[@]} -eq 0 ] || gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --prerelease="$PRERELEASE" --generate-notes
          fi
